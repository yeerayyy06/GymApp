name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analyze-project-tue8k
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Drift web worker
        run: dart compile js -O4 -o web/drift_worker.js web/drift_worker.dart

      - name: Download sqlite3 wasm
        run: |
          VERSION=$(grep -A 10 '^  sqlite3:' pubspec.lock | grep -m 1 '^    version:' | awk '{print $2}' | tr -d '"')
          echo "sqlite3 dart package version: $VERSION"
          curl -L --fail -o web/sqlite3.wasm \
            "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${VERSION}/sqlite3.wasm"

      - name: Build web release
        run: flutter build web --release --base-href "/GymApp/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
