name: gym_tracker
description: "Gym Tracker AI — registro rápido de entrenamientos con sobrecarga progresiva automatizada y mapa de calor muscular."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local persistence (offline-first SQLite via Drift)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # IDs
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.69.0

  # Typography (Inter — cerca a SF Pro Display)
  google_fonts: ^6.2.1

  # Persistencia de preferencias
  shared_preferences: ^2.3.4

  # Animación de PR
  confetti: ^0.7.0

  # Skeleton loaders
  shimmer: ^3.0.0

  # Exportar archivos
  file_saver: ^0.2.14

  # Web APIs (Notification, etc)
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Codegen
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
