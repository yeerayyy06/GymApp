<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gym Tracker — registro de entrenamientos">
  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Gym Tracker</title>

  <style>
    :root {
      --bg: #000000;
      --primary: #6366F1;
      --tertiary: #F472B6;
      --text: #E9E9EE;
      --muted: #74747D;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 360ms ease-out;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Anillos concéntricos pulsantes */
    .ring {
      position: absolute;
      border-radius: 999px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      animation: pulse 2.2s ease-out infinite;
    }
    .ring-1 { width: 96px;  height: 96px;  animation-delay: 0s;   }
    .ring-2 { width: 132px; height: 132px; animation-delay: 0.4s; }
    .ring-3 { width: 168px; height: 168px; animation-delay: 0.8s; }
    @keyframes pulse {
      0%   { transform: scale(0.92); opacity: 0.75; }
      70%  { transform: scale(1.05); opacity: 0.05; }
      100% { transform: scale(1.05); opacity: 0; }
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--tertiary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -1px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
      z-index: 1;
    }
    .wordmark {
      margin-top: 28px;
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .tagline {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }
    #splash-error {
      position: absolute;
      bottom: 40px;
      left: 20px;
      right: 20px;
      color: #ff8a80;
      font-size: 11px;
      text-align: center;
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="logo">GT</div>
    </div>
    <div class="wordmark">Gym Tracker</div>
    <div class="tagline" id="splash-text">Cargando</div>
    <div id="splash-error"></div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var textBox = document.getElementById('splash-text');
      var errorBox = document.getElementById('splash-error');
      var loaded = false;

      window.addEventListener('flutter-first-frame', function () {
        loaded = true;
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 380);
      });

      window.addEventListener('error', function (e) {
        if (!loaded && errorBox) {
          errorBox.textContent =
            (e.message || 'Error desconocido') +
            (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '');
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        if (!loaded && errorBox) {
          errorBox.textContent = 'Promise rejection: ' + (e.reason || 'sin detalle');
        }
      });

      setTimeout(function () {
        if (!loaded && textBox) {
          textBox.textContent = 'Tardando más de lo normal';
        }
      }, 10000);

      setTimeout(function () {
        if (!loaded && errorBox && !errorBox.textContent) {
          errorBox.textContent =
            'La app no ha cargado en 25s. Mantén pulsado el botón de recargar para forzar.';
        }
      }, 25000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
