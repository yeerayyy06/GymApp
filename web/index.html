<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gym Tracker — registro de entrenamientos">
  <meta name="theme-color" content="#000000">

  <!-- iOS PWA support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Gym Tracker</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #b39ddb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 300ms ease-out;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(179, 157, 219, 0.2);
      border-top-color: #b39ddb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash-text {
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    #splash-error {
      max-width: 80%;
      color: #ff8a80;
      font-size: 11px;
      text-align: center;
      margin-top: 20px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner"></div>
    <div id="splash-text">Cargando Gym Tracker…</div>
    <div id="splash-error"></div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var textBox = document.getElementById('splash-text');
      var errorBox = document.getElementById('splash-error');
      var loaded = false;

      window.addEventListener('flutter-first-frame', function () {
        loaded = true;
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 350);
      });

      window.addEventListener('error', function (e) {
        if (!loaded && errorBox) {
          errorBox.textContent =
            (e.message || 'Error desconocido') +
            (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '');
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        if (!loaded && errorBox) {
          errorBox.textContent = 'Promise rejection: ' + (e.reason || 'sin detalle');
        }
      });

      setTimeout(function () {
        if (!loaded && textBox) {
          textBox.textContent = 'Tardando más de lo normal…';
        }
      }, 10000);

      setTimeout(function () {
        if (!loaded && errorBox && !errorBox.textContent) {
          errorBox.textContent =
            'La app no ha cargado en 25s. Mantén pulsado el botón de recargar para forzar.';
        }
      }, 25000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
